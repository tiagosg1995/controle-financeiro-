
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Controle Financeiro
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">



<!-- =====================================================
     HEADER
===================================================== -->


<header>


<h1>
💳 Controle Financeiro
</h1>


<p>
Gerencie suas contas pessoais de forma simples e rápida
</p>


</header>





<!-- =====================================================
     DASHBOARD
===================================================== -->


<section class="dashboard">



<div class="resumoCard">


<span>
💰 Total Geral
</span>


<strong id="totalGeral">

R$ 0,00

</strong>


</div>




<div class="resumoCard">


<span>
💳 Cartões
</span>


<strong id="totalCartoes">

0

</strong>


</div>





<div class="resumoCard">


<span>
📋 Lançamentos
</span>


<strong id="totalLancamentos">

0

</strong>


</div>



</section>







<!-- =====================================================
     NOVA CONTA
===================================================== -->


<section class="card">


<h2>
➕ Nova Conta
</h2>




<div class="grupo">


<label>
Nome da pessoa
</label>


<input

type="text"

id="nome"

placeholder="Digite o nome">


</div>





<div class="grupo">


<label>
Cartão utilizado
</label>


<select id="cartao">


<option>
Nubank
</option>


<option>
Rico
</option>


<option>
Itaú
</option>


<option>
Bradesco
</option>


<option>
Santander
</option>


<option>
Outro
</option>


</select>


</div>





<div class="grupo">


<label>
Valor da conta
</label>


<input

type="number"

id="valor"

step="0.01"

placeholder="0,00">


</div>





<button id="btnSalvar">

💾 Salvar Conta

</button>



</section>








<!-- =====================================================
     PESQUISA
===================================================== -->


<section class="card">


<h2>
🔎 Pesquisar contas
</h2>



<input

type="text"

id="pesquisa"

placeholder="Digite o nome da pessoa">


</section>








<!-- =====================================================
     BOTÕES PDF
===================================================== -->


<div class="acoesPDF">


<button id="btnPDF">

📄 PDF por Pessoa

</button>



<button id="btnPDFTodos">

📄 PDF Todos

</button>


</div>









<!-- =====================================================
     LISTA DE CONTAS
===================================================== -->


<section class="card">


<h2>
📋 Contas cadastradas
</h2>



<div

id="listaContas"

class="listaContas">


</div>



</section>









<!-- =====================================================
     RESUMO CARTÕES
===================================================== -->


<section class="card">


<h2>

📊 Resumo por cartão

</h2>



<div

id="totais">


</div>



</section>







</div>









<!-- =====================================================
     BIBLIOTECA PDF
===================================================== -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>




<!-- =====================================================
     SCRIPT PRINCIPAL
===================================================== -->


<script src="script.js">

</script>



</body>


</html>
